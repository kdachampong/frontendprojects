<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
   <link rel="stylesheet" href="./src/output.css">
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class=" bg-prjgrey-900 flex justify-center items-center h-full md:h-svh">
    <article class="w-[327px] p-6 md:p-10 md:w-sm bg-prjgrey-800 rounded-xl">
      <section>
        <div>
          <img class="w-22.5 rounded-full mx-auto" src="./assets/images/avatar-jessica.jpeg" alt="avatar-jessica">
        </div>
        <div class="my-6 font-inter text-center">
          <h1 class="text-2xl font-semibold text-white mb-1.5">
            Jessica Randall
          </h1>
          <h2 class="text-sm font-semibold text-prjgreen-500 mb-6">
            London, United Kingdom
          </h2>
          <p class="font-normal text-sm text-white">
            "Front-end developer and avid reader."
          </p>
        </div>
      </section>
      <nav>
        <ul class="flex flex-col gap-4 font-inter font-bold text-center text-sm leading-[150%] text-white">
          <li><a class="block bg-prjgrey-700 py-3.5 rounded-lg hover:bg-prjgreen-500 transition duration-3.500 ease-in-out hover:text-prjgrey-700" href="#">GitHub</a></li>
          <li><a class="block bg-prjgrey-700 py-3.5 rounded-lg hover:bg-prjgreen-500 transition duration-3.500 ease-in-out hover:text-prjgrey-700" href="#">Frontend Mentor</a></li>
          <li><a class="block bg-prjgrey-700 py-3.5 rounded-lg hover:bg-prjgreen-500 transition duration-3.500 ease-in-out hover:text-prjgrey-700" href="#">LinkedIn</a></li>
          <li><a class="block bg-prjgrey-700 py-3.5 rounded-lg hover:bg-prjgreen-500 transition duration-3.500 ease-in-out hover:text-prjgrey-700" href="#">Twitter</a></li>
          <li><a class="block bg-prjgrey-700 py-3.5 rounded-lg hover:bg-prjgreen-500 transition duration-300 ease-in-out hover:text-prjgrey-700" href="#">Instagram</a></li>
        </ul>
      </nav>
    </article>
  </main>

    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div> -->
</body>
</html>
